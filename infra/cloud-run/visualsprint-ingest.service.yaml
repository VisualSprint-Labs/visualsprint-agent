apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: visualsprint-ingest
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      serviceAccountName: visualsprint-ingest@visualsprint-agent.iam.gserviceaccount.com
      containers:
        - image: us-west1-docker.pkg.dev/visualsprint-agent/visualsprint/ingest:latest
          ports:
            - containerPort: 8080
          env:
            - name: VISUALSPRINT_ENV
              value: production
            - name: VISUALSPRINT_TRACK
              value: elastic
            - name: GOOGLE_CLOUD_PROJECT
              value: visualsprint-agent
            - name: GOOGLE_CLOUD_LOCATION
              value: us-west1
            - name: GCS_BUCKET
              value: visualsprint-capture-media
            - name: GCS_SIGNED_URL_TTL_SECONDS
              value: "600"
            - name: SPEECH_LANGUAGE_CODE
              value: en-US
            - name: SPEECH_ENABLE_SPEAKER_DIARIZATION
              value: "true"
            - name: VISUALSPRINT_ALLOWED_ORIGINS
              value: https://app.visualsprint.dev
